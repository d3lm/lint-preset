name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  native:
    uses: ./.github/workflows/native.yml

  publish:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"

          version="$(node -p "require('./package.json').version")"

          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm lint

      # the native job already ran the tests on every target, with the addons that ship
      - run: rm -f native/*.node

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native
          merge-multiple: true

      # `prepublishOnly` builds the JavaScript and checks that the addon of every target is in place
      - run: npm publish
